name: .NET CI/CD

on:
  push:
    branches: [ "Main-new" ]
  pull_request:
    branches: [ "Main-new" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    # Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Cache NuGet packages para otimizar builds futuros
    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # Restore dependências
    - name: Restore dependencies
      run: dotnet restore LightInvest/LightInvest.csproj

    # Build do projeto
    - name: Build da aplicação
      run: dotnet build LightInvest/LightInvest.csproj --configuration Release --no-restore

    # Executa testes
    - name: Run tests
      run: dotnet test LightInvest/LightInvest.csproj --configuration Release --no-build --verbosity normal
