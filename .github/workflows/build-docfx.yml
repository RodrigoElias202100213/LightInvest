name: Build DocFX Documentation

on:
  push:
    branches:
      - main  # ou qualquer branch que você deseja monitorar
  pull_request:
    branches:
      - main  # ou qualquer branch que você deseja monitorar

jobs:
  build:
    runs-on: ubuntu-latest  # Você pode usar outras imagens conforme necessário (ex: windows-latest)

    steps:
      # Passo 1: Faz o checkout do código
      - name: Checkout Code
        uses: actions/checkout@v2

      # Passo 2: Instala o .NET SDK
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '6.x'  # ou a versão que você usa no seu projeto

      # Passo 3: Restaura dependências do projeto
      - name: Restore dependencies
        run: dotnet restore

      # Passo 4: Instalar o DocFX via NuGet (caso necessário)
      - name: Install DocFX
        run: dotnet tool install --global docfx --version 2.x.x  # substitua pela versão necessária

      # Passo 5: Gerar a documentação com o DocFX
      - name: Build DocFX Documentation
        run: dotnet docfx build docfx.json --output _site  # Ajuste conforme necessário
